<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Gia Dinh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcbfa0"/>
      <stop offset="1" stop-color="#9d7a55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".30">
    <circle cx="675" cy="300" r="180"/>
    <circle cx="180" cy="900" r="128"/>
  </g>
  <rect x="40" y="40" width="820" height="1120" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.5"/>
  <text x="450" y="590" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="56" fill="#ffffff" fill-opacity=".95" letter-spacing="2">Gia Dinh</text>
  <text x="450" y="645" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="18" fill="#ffffff" fill-opacity=".75" letter-spacing="7">QUOC AN STUDIO</text>
</svg>
