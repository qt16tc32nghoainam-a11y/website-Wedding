<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Pre-Wedding">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4b9a3"/>
      <stop offset="1" stop-color="#8b6f5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".30">
    <circle cx="1200" cy="225" r="320"/>
    <circle cx="320" cy="675" r="228"/>
  </g>
  <rect x="72" y="72" width="1456" height="756" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.5"/>
  <text x="800" y="440" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="100" fill="#ffffff" fill-opacity=".95" letter-spacing="2">Pre-Wedding</text>
  <text x="800" y="530" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="33" fill="#ffffff" fill-opacity=".75" letter-spacing="7">QUOC AN STUDIO</text>
</svg>
